name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path src/launchforge.py -Pattern '^APP_VERSION\s*=' | Select-Object -First 1
          if (-not $line) { throw 'APP_VERSION not found' }
          $ver = ($line.Line -split "'")[1]
          "version=$ver" >> $env:GITHUB_OUTPUT
          # 注意：发布资产用 ASCII 名。GitHub Actions 处理非 ASCII 文件名时会丢字符
          # （v1.6.1 曾产出 _v1.6.1.exe），因此这里统一用 LaunchForge_vX.Y.Z。
          "name=LaunchForge_v$ver" >> $env:GITHUB_OUTPUT
          Write-Host "version = $ver"

      - name: Syntax check
        run: python -m py_compile src/launchforge.py

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --icon=assets/logo.ico `
            --add-data "assets/logo.ico;." `
            --version-file=version.txt `
            --name "${{ steps.ver.outputs.name }}" `
            src/launchforge.py

      - name: Verify artifact
        shell: pwsh
        run: |
          $f = "dist/${{ steps.ver.outputs.name }}.exe"
          if (-not (Test-Path $f)) { throw "artifact missing: $f" }
          $item = Get-Item $f
          Write-Host ("size = {0:N0} bytes" -f $item.Length)
          $item.VersionInfo | Format-List FileVersion, ProductVersion, FileDescription

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ steps.ver.outputs.version }}
          path: dist/*.exe
          retention-days: 30

      - name: Prepare release body
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $repo = "https://github.com/weijianluo114-ux/Start_All"
          # 用数组拼正文，避免 PowerShell here-string：YAML 块标量会保留两格缩进，
          # 而 here-string 的结束符必须顶格，缩进后会直接报语法错误。
          $lines = @(
            "## 一键多启 v$ver",
            "",
            "### 本次变更",
            "完整变更见 [CHANGELOG]($repo/blob/main/CHANGELOG.md)。",
            "",
            "### 下载与使用",
            "",
            "1. 下载下方 **LaunchForge_v$ver.exe**；",
            "2. 放到任意目录双击运行，无需安装 Python 或依赖；",
            "3. 配置与日志在 **%LOCALAPPDATA%\MultiLauncher**，删除该目录即可完全重置。",
            "",
            "> 未做代码签名，首次运行若出现 SmartScreen 提示，选择「更多信息 → 仍要运行」。",
            "",
            "### 已知限制",
            "",
            "- 文件夹只能**整窗关闭**：Windows 未提供「关闭某个标签页」的稳定接口（详见 docs/04-问题/Q-003）",
            "- 按镜像名关闭会命中同名全部实例",
            "- .bat / .cmd 条目启动时仍显示控制台窗口（批处理需要，属预期行为）",
            "",
            "使用说明见 [README]($repo#readme)。"
          )
          $body = $lines -join "`n"
          [System.IO.File]::WriteAllText("$PWD/release_body.md", $body,
              (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "--- release_body.md ---"
          Get-Content release_body.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          # append_body 是布尔开关（默认 false），不能直接塞正文；正文改用 body_path。
          # 也不再依赖 generate_release_notes：它只产出 "Full Changelog" 一行，信息量太低。
          body_path: release_body.md
          fail_on_unmatched_files: true
